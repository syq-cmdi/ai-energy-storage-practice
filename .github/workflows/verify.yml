name: Verify teaching experiments
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: python chapters/ch02/verify.py
      - run: python build_demo.py
      - run: node --test tests/demo.test.cjs
      - name: Install plotting dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r requirements-viz.txt
      - name: Regenerate quantitative plots and schematics
        if: runner.os == 'Linux'
        run: |
          python chapters/ch02/plot_results.py
          python chapters/ch02/draw_diagrams.py
