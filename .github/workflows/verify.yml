name: Verify teaching experiments
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt
      - run: python chapters/ch02/verify.py
      - run: python build_demo.py
      - run: node --test tests/demo.test.cjs
      - run: python chapters/ch03/verify.py
      - run: python chapters/ch03/build_demo.py
      - run: node --test tests/ch03.test.cjs
      - run: python chapters/ch04/verify.py
      - run: python chapters/ch04/run.py --out results/ch04
      - run: python chapters/ch04/build_demo.py --source results/ch04/experiment.json
      - run: node --test tests/ch04.test.cjs
      - run: python chapters/ch05/run.py --out results/ch05
      - run: python chapters/ch05/verify.py
      - run: python chapters/ch05/build_demo.py
      - run: node --test tests/ch05.test.cjs
      - run: python chapters/ch06/run.py --out results/ch06
      - run: python chapters/ch06/verify.py
      - run: python chapters/ch06/build_demo.py
      - run: node --test tests/ch06.test.cjs
      - run: python chapters/ch07/run.py --out results/ch07
      - run: python chapters/ch07/verify.py
      - run: python chapters/ch07/build_demo.py
      - run: node --test tests/ch07.test.cjs
      - run: python chapters/ch08/run.py
      - run: python chapters/ch08/verify.py
      - run: python chapters/ch08/build_demo.py
      - run: node --test tests/ch08.test.cjs
      - run: python chapters/ch09/run.py
      - run: python chapters/ch09/verify.py
      - run: python chapters/ch09/build_demo.py
      - run: node --test tests/ch09.test.cjs
      - run: python chapters/ch10/run.py
      - run: python chapters/ch10/verify.py
      - run: python chapters/ch10/build_demo.py
      - run: node --test tests/ch10.test.cjs
      - name: Install plotting dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r requirements-viz.txt
      - name: Regenerate quantitative plots and schematics
        if: runner.os == 'Linux'
        run: |
          python chapters/ch02/plot_results.py
          python chapters/ch02/draw_diagrams.py
          python chapters/ch03/plot_results.py
          python chapters/ch03/draw_diagrams.py
          python chapters/ch04/plot_results.py
          python chapters/ch04/draw_diagrams.py
          python chapters/ch05/plot_results.py
          python chapters/ch05/draw_diagrams.py
          python chapters/ch06/plot_results.py
          python chapters/ch06/draw_diagrams.py
          python chapters/ch07/plot_results.py
          python chapters/ch07/draw_diagrams.py
          python chapters/ch08/plot_results.py
          python chapters/ch08/draw_diagrams.py
          python chapters/ch09/plot_results.py
          python chapters/ch10/plot_results.py
