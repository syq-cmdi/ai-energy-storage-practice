<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700"><defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#526A7A" stroke-width="1.5"/></marker></defs><rect width="1440" height="700" fill="white"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Noto Sans CJK JP, sans-serif"><text x="38" y="48" font-size="34" fill="#087F8C" text-anchor="start" font-weight="600">按设备留出，再沿时间生成可用证据</text><rect x="38" y="98" width="298" height="150" rx="10" fill="white" stroke="#3466B0" stroke-width="2"/><rect x="38" y="98" width="298" height="10" rx="2" fill="#3466B0" stroke="#3466B0" stroke-width="2"/><text x="60" y="147" font-size="29" fill="#3466B0" text-anchor="start" font-weight="600">连续传感器记录</text><text x="60" y="189" font-size="25" fill="#183448" text-anchor="start" font-weight="400">电压A/B · 电流 · 温度</text><text x="60" y="223" font-size="25" fill="#183448" text-anchor="start" font-weight="400">统一时标与单位</text><rect x="393" y="98" width="298" height="150" rx="10" fill="white" stroke="#7954A1" stroke-width="2"/><rect x="393" y="98" width="298" height="10" rx="2" fill="#7954A1" stroke="#7954A1" stroke-width="2"/><text x="415" y="147" font-size="29" fill="#7954A1" text-anchor="start" font-weight="600">数据有效性门控</text><text x="415" y="189" font-size="25" fill="#183448" text-anchor="start" font-weight="400">缺失 → 不可判定</text><text x="415" y="223" font-size="25" fill="#183448" text-anchor="start" font-weight="400">恢复 → 重建5点窗口</text><rect x="748" y="98" width="298" height="150" rx="10" fill="white" stroke="#087F8C" stroke-width="2"/><rect x="748" y="98" width="298" height="10" rx="2" fill="#087F8C" stroke="#087F8C" stroke-width="2"/><text x="770" y="147" font-size="29" fill="#087F8C" text-anchor="start" font-weight="600">因果特征与分值</text><text x="770" y="189" font-size="25" fill="#183448" text-anchor="start" font-weight="400">仅用当前及此前样本</text><text x="770" y="223" font-size="25" fill="#183448" text-anchor="start" font-weight="400">规则 / 分类 / 孤立森林</text><rect x="1103" y="98" width="298" height="150" rx="10" fill="white" stroke="#C17D1F" stroke-width="2"/><rect x="1103" y="98" width="298" height="10" rx="2" fill="#C17D1F" stroke="#C17D1F" stroke-width="2"/><text x="1125" y="147" font-size="29" fill="#C17D1F" text-anchor="start" font-weight="600">告警与待核查假设</text><text x="1125" y="189" font-size="25" fill="#183448" text-anchor="start" font-weight="400">阈值 + 连续点数</text><text x="1125" y="223" font-size="25" fill="#183448" text-anchor="start" font-weight="400">证据冲突时保留未知</text><path d="M340,173 L384,173" fill="none" stroke="#526A7A" stroke-width="2.5" marker-end="url(#a)"/><path d="M695,173 L739,173" fill="none" stroke="#526A7A" stroke-width="2.5" marker-end="url(#a)"/><path d="M1050,173 L1094,173" fill="none" stroke="#526A7A" stroke-width="2.5" marker-end="url(#a)"/><text x="38" y="315" font-size="30" fill="#183448" text-anchor="start" font-weight="600">学习与评价协议</text><rect x="38" y="350" width="403" height="150" rx="10" fill="white" stroke="#3466B0" stroke-width="2"/><rect x="38" y="350" width="403" height="10" rx="2" fill="#3466B0" stroke="#3466B0" stroke-width="2"/><text x="60" y="399" font-size="29" fill="#3466B0" text-anchor="start" font-weight="600">D01—D08 训练</text><text x="60" y="441" font-size="25" fill="#183448" text-anchor="start" font-weight="400">8设备 × 6会话</text><text x="60" y="475" font-size="25" fill="#183448" text-anchor="start" font-weight="400">拟合缩放、分类器和正常分布</text><rect x="518" y="350" width="403" height="150" rx="10" fill="white" stroke="#087F8C" stroke-width="2"/><rect x="518" y="350" width="403" height="10" rx="2" fill="#087F8C" stroke="#087F8C" stroke-width="2"/><text x="540" y="399" font-size="29" fill="#087F8C" text-anchor="start" font-weight="600">D09—D12 选择</text><text x="540" y="441" font-size="25" fill="#183448" text-anchor="start" font-weight="400">4设备 × 6会话</text><text x="540" y="475" font-size="25" fill="#183448" text-anchor="start" font-weight="400">按事件召回与误报预算选阈值</text><rect x="998" y="350" width="403" height="150" rx="10" fill="white" stroke="#C17D1F" stroke-width="2"/><rect x="998" y="350" width="403" height="10" rx="2" fill="#C17D1F" stroke="#C17D1F" stroke-width="2"/><text x="1020" y="399" font-size="29" fill="#C17D1F" text-anchor="start" font-weight="600">D13—D16 测试</text><text x="1020" y="441" font-size="25" fill="#183448" text-anchor="start" font-weight="400">4设备 × 7会话</text><text x="1020" y="475" font-size="25" fill="#183448" text-anchor="start" font-weight="400">冻结后加入新组合与缺失压力</text><path d="M443,424 L505,424" fill="none" stroke="#526A7A" stroke-width="2.5" marker-end="url(#a)"/><path d="M923,424 L986,424" fill="none" stroke="#526A7A" stroke-width="2.5" marker-end="url(#a)"/><rect x="38" y="555" width="1363" height="104" rx="10" fill="#F5F8FA" stroke="#D9E4EB" stroke-width="2"/><text x="65" y="599" font-size="29" fill="#183448" text-anchor="start" font-weight="400">会话内部窗口不跨设备、不跨会话；测试事件目录只用于评分。</text><text x="65" y="636" font-size="25" fill="#526A7A" text-anchor="start" font-weight="400">训练和阈值选择结束后冻结配置，再报告测试误报、漏报、延迟及不可判定时长。</text></g></svg>