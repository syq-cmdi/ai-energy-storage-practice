<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="740" viewBox="0 0 1440 740"><defs><marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L11 6 L1 11" fill="none" stroke="#526A7A" stroke-width="1.5"/></marker></defs><rect width="1440" height="740" fill="white"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Noto Sans CJK JP, sans-serif"><text x="38" y="48" font-size="34" fill="#087F8C" text-anchor="start" font-weight="600">从异常线索到待核查假设</text><rect x="38" y="93" width="403" height="150" rx="10" fill="white" stroke="#3466B0" stroke-width="2"/><rect x="38" y="93" width="403" height="10" rx="2" fill="#3466B0" stroke="#3466B0" stroke-width="2"/><text x="60" y="142" font-size="29" fill="#3466B0" text-anchor="start" font-weight="600">电压通道一致性</text><text x="60" y="184" font-size="25" fill="#183448" text-anchor="start" font-weight="400">A与B是否共同变化</text><text x="60" y="218" font-size="25" fill="#183448" text-anchor="start" font-weight="400">单通道偏移提供传感器线索</text><rect x="518" y="93" width="403" height="150" rx="10" fill="white" stroke="#C17D1F" stroke-width="2"/><rect x="518" y="93" width="403" height="10" rx="2" fill="#C17D1F" stroke="#C17D1F" stroke-width="2"/><text x="540" y="142" font-size="29" fill="#C17D1F" text-anchor="start" font-weight="600">负载与模型残差</text><text x="540" y="184" font-size="25" fill="#183448" text-anchor="start" font-weight="400">共同压降是否随电流增大</text><text x="540" y="218" font-size="25" fill="#183448" text-anchor="start" font-weight="400">检查标称参数及接触条件</text><rect x="998" y="93" width="403" height="150" rx="10" fill="white" stroke="#7954A1" stroke-width="2"/><rect x="998" y="93" width="403" height="10" rx="2" fill="#7954A1" stroke="#7954A1" stroke-width="2"/><text x="1020" y="142" font-size="29" fill="#7954A1" text-anchor="start" font-weight="600">热响应与环境条件</text><text x="1020" y="184" font-size="25" fill="#183448" text-anchor="start" font-weight="400">温度残差与散热条件</text><text x="1020" y="218" font-size="25" fill="#183448" text-anchor="start" font-weight="400">复测温度并核对环境输入</text><path d="M240,247 L240,292" fill="none" stroke="#526A7A" stroke-width="2.5"/><path d="M240,292 L720,292" fill="none" stroke="#526A7A" stroke-width="2.5"/><path d="M720,247 L720,292" fill="none" stroke="#526A7A" stroke-width="2.5"/><path d="M720,292 L720,292" fill="none" stroke="#526A7A" stroke-width="2.5"/><path d="M1200,247 L1200,292" fill="none" stroke="#526A7A" stroke-width="2.5"/><path d="M1200,292 L720,292" fill="none" stroke="#526A7A" stroke-width="2.5"/><path d="M720,292 L720,328" fill="none" stroke="#526A7A" stroke-width="2.5" marker-end="url(#a)"/><rect x="340" y="341" width="760" height="120" rx="10" fill="#EAF6F5" stroke="#087F8C" stroke-width="2"/><text x="720" y="378" font-size="30" fill="#087F8C" text-anchor="middle" font-weight="600">证据条件 + 分类器输出的一致性检查</text><text x="720" y="414" font-size="25" fill="#183448" text-anchor="middle" font-weight="400">完整数据 · 当前告警 · 单一特征签名</text><text x="720" y="448" font-size="25" fill="#183448" text-anchor="middle" font-weight="400">输出相符 · 最大类别分值≥0.80</text><path d="M540,465 L540,497" fill="none" stroke="#526A7A" stroke-width="2.5"/><path d="M540,497 L316,497" fill="none" stroke="#526A7A" stroke-width="2.5"/><path d="M316,497 L316,535" fill="none" stroke="#526A7A" stroke-width="2.5" marker-end="url(#a)"/><path d="M900,465 L900,497" fill="none" stroke="#526A7A" stroke-width="2.5"/><path d="M900,497 L1104,497" fill="none" stroke="#526A7A" stroke-width="2.5"/><path d="M1104,497 L1104,535" fill="none" stroke="#526A7A" stroke-width="2.5" marker-end="url(#a)"/><text x="390" y="484" font-size="24" fill="#087F8C" text-anchor="start" font-weight="400">满足</text><text x="980" y="484" font-size="24" fill="#7954A1" text-anchor="start" font-weight="400">冲突或不足</text><rect x="38" y="550" width="560" height="150" rx="10" fill="white" stroke="#087F8C" stroke-width="2"/><rect x="38" y="550" width="560" height="10" rx="2" fill="#087F8C" stroke="#087F8C" stroke-width="2"/><text x="60" y="599" font-size="29" fill="#087F8C" text-anchor="start" font-weight="600">形成待核查假设</text><text x="60" y="641" font-size="25" fill="#183448" text-anchor="start" font-weight="400">标记支持证据、时刻与建议复测项</text><text x="60" y="675" font-size="25" fill="#183448" text-anchor="start" font-weight="400">现场原因仍由独立测量和检查确认</text><rect x="842" y="550" width="560" height="150" rx="10" fill="white" stroke="#7954A1" stroke-width="2"/><rect x="842" y="550" width="560" height="10" rx="2" fill="#7954A1" stroke="#7954A1" stroke-width="2"/><text x="864" y="599" font-size="29" fill="#7954A1" text-anchor="start" font-weight="600">保留未知或数据不可用</text><text x="864" y="641" font-size="25" fill="#183448" text-anchor="start" font-weight="400">原因解释由独立证据支持</text><text x="864" y="675" font-size="25" fill="#183448" text-anchor="start" font-weight="400">安排独立电压、温度及连接状态核查</text></g></svg>